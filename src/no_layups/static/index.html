<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>No Layups</title>
    <style>
      body {
        margin: 0;
        background: #0d0e12;
        color: #e6e8ef;
        font-family: system-ui, sans-serif;
      }
      header {
        padding: 0.75rem 1rem;
      }
      header h1 {
        font-size: 1.1rem;
        margin: 0;
      }
      section {
        display: none;
      }
      section.active {
        display: block;
      }
      #upload-screen {
        max-width: 480px;
        margin: 3rem auto;
        padding: 1.5rem;
      }
      #drop-zone {
        border: 2px dashed #333846;
        border-radius: 8px;
        padding: 2.5rem 1rem;
        text-align: center;
        cursor: pointer;
        margin-bottom: 1rem;
      }
      #drop-zone.drag-over {
        border-color: #4dd0e1;
        color: #4dd0e1;
      }
      #upload-screen fieldset {
        border: 1px solid #333846;
        border-radius: 4px;
        margin-bottom: 1rem;
      }
      #upload-error {
        color: #ff6b6b;
        margin-bottom: 1rem;
        white-space: pre-wrap;
      }
      #processing-screen {
        max-width: 480px;
        margin: 5rem auto;
        text-align: center;
      }
      #viewers {
        display: flex;
        gap: 2px;
      }
      #viewers canvas {
        display: block;
        flex: 1;
        min-width: 0;
        width: 100%;
        height: 60vh;
      }
      #viewers canvas[hidden] {
        display: none;
      }
      #controls,
      #compare-controls,
      #keyframe-editor-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem;
        padding: 0.75rem 1rem;
      }
      #compare-controls[hidden],
      #keyframe-editor-controls[hidden] {
        display: none;
      }
      #controls button,
      #controls select,
      #compare-controls button,
      #keyframe-editor button,
      #keyframe-editor-controls button,
      #upload-screen button,
      #upload-screen select {
        background: #1c1f27;
        color: #e6e8ef;
        border: 1px solid #333846;
        border-radius: 4px;
        padding: 0.35rem 0.7rem;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #frame-slider,
      #phase-slider {
        flex: 1;
        min-width: 200px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 0.35rem;
      }
      #tick-row {
        position: relative;
        height: 12px;
        margin: 0 1rem;
      }
      .tick {
        position: absolute;
        top: 0;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        transform: translateX(-50%);
        border: 1px solid #0d0e12;
      }
      .tick.address {
        background: #4caf50;
      }
      .tick.top {
        background: #ffd166;
      }
      .tick.impact {
        background: #ff6b6b;
      }
      .tick.unset {
        background: #555a68;
      }
      #keyframe-editor {
        padding: 0 1rem;
      }
      #keyframe-error {
        color: #ff6b6b;
      }
      #reference-badge {
        display: inline-block;
        margin: 0 1rem;
        padding: 0.15rem 0.5rem;
        border: 1px solid #ffd166;
        border-radius: 4px;
        color: #ffd166;
        font-size: 0.85rem;
      }
      #metrics-panel {
        padding: 0.5rem 1rem 2rem;
      }
      #metrics-panel table {
        width: 100%;
        max-width: 640px;
        border-collapse: collapse;
      }
      #metrics-panel th,
      #metrics-panel td {
        text-align: left;
        padding: 0.3rem 0.6rem;
        border-bottom: 1px solid #23262f;
      }
      .rating-dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }
      .rating-dot.good {
        background: #4caf50;
      }
      .rating-dot.ok {
        background: #ffb84d;
      }
      .rating-dot.attention {
        background: #ff6b6b;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <header>
      <h1>No Layups</h1>
    </header>

    <section id="upload-screen" class="active">
      <div id="upload-error" hidden></div>
      <form id="upload-form">
        <div id="drop-zone">
          <p>Drop a swing video here, or click to choose a file</p>
          <input id="video-input" type="file" accept="video/*" hidden />
          <p id="selected-file"></p>
        </div>
        <fieldset>
          <legend>Handedness</legend>
          <label><input type="radio" name="handedness" value="right" checked /> Right-handed</label>
          <label><input type="radio" name="handedness" value="left" /> Left-handed</label>
        </fieldset>
        <button id="upload-submit" type="submit" disabled>Analyze swing</button>
      </form>
    </section>

    <section id="processing-screen">
      <p id="processing-step">Analyzing motion&hellip;</p>
      <button id="processing-cancel" type="button" hidden>Try again</button>
    </section>

    <section id="analysis-screen">
      <div id="viewers">
        <canvas id="viewer-canvas"></canvas>
        <canvas id="ref-viewer-canvas" hidden></canvas>
      </div>

      <div id="tick-row"></div>

      <div id="controls">
        <button id="play-pause">Play</button>
        <select id="speed-select">
          <option value="0.25">0.25&times;</option>
          <option value="0.5">0.5&times;</option>
          <option value="1" selected>1&times;</option>
        </select>
        <input id="frame-slider" type="range" min="0" max="0" value="0" />
        <span id="frame-label">Frame 0</span>
        <button id="cam-face-on">Face-on</button>
        <button id="cam-down-the-line">Down-the-line</button>
        <button id="cam-top">Top</button>
        <label><input id="mirror-toggle" type="checkbox" /> Mirror</label>
        <label><input id="compare-toggle" type="checkbox" /> Compare with reference</label>
        <button id="new-swing">Analyze another swing</button>
      </div>

      <div id="compare-controls" hidden>
        <button id="compare-play-pause">Play</button>
        <input id="phase-slider" type="range" min="0" max="100" value="0" />
        <span id="phase-label">Phase 0%</span>
      </div>

      <div id="keyframe-editor">
        <button id="adjust-keyframes" type="button">Adjust key moments</button>
        <span id="reference-badge" hidden>Placeholder reference</span>
        <div id="keyframe-editor-controls" hidden>
          <span>Scrub to a frame above, then:</span>
          <button id="set-address" type="button">Set address</button>
          <button id="set-top" type="button">Set top</button>
          <button id="set-impact" type="button">Set impact</button>
          <span id="pending-keyframes"></span>
          <button id="apply-keyframes" type="button" disabled>Apply</button>
          <button id="cancel-keyframes" type="button">Cancel</button>
          <span id="keyframe-error"></span>
        </div>
      </div>

      <div id="metrics-panel">
        <table>
          <thead>
            <tr>
              <th>Metric</th>
              <th>You</th>
              <th>Reference</th>
              <th>Delta</th>
              <th>Rating</th>
            </tr>
          </thead>
          <tbody id="metrics-tbody"></tbody>
        </table>
      </div>
    </section>

    <script type="module" src="/app.js"></script>
  </body>
</html>
