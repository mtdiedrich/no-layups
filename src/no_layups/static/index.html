<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>No Layups</title>
    <style>
      body {
        margin: 0;
        background: #0d0e12;
        color: #e6e8ef;
        font-family: system-ui, sans-serif;
      }
      header {
        padding: 0.75rem 1rem;
      }
      header h1 {
        font-size: 1.1rem;
        margin: 0;
      }
      #viewer-canvas {
        display: block;
        width: 100%;
        height: 70vh;
      }
      #controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem;
        padding: 0.75rem 1rem;
      }
      #controls button,
      #controls select {
        background: #1c1f27;
        color: #e6e8ef;
        border: 1px solid #333846;
        border-radius: 4px;
        padding: 0.35rem 0.7rem;
      }
      #frame-slider {
        flex: 1;
        min-width: 200px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 0.35rem;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <header>
      <h1>No Layups</h1>
    </header>
    <canvas id="viewer-canvas"></canvas>
    <div id="controls">
      <button id="play-pause">Play</button>
      <select id="speed-select">
        <option value="0.25">0.25&times;</option>
        <option value="0.5">0.5&times;</option>
        <option value="1" selected>1&times;</option>
      </select>
      <input id="frame-slider" type="range" min="0" max="0" value="0" />
      <span id="frame-label">Frame 0</span>
      <button id="cam-face-on">Face-on</button>
      <button id="cam-down-the-line">Down-the-line</button>
      <button id="cam-top">Top</button>
      <label><input id="mirror-toggle" type="checkbox" /> Mirror</label>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
