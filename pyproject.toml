[project]
name = "no-layups"
version = "0.1.0"
description = "Convert golf swing footage to an interactive 3D skeleton with swing analysis"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<0.31",
    "python-multipart>=0.0.9,<0.1",
    "opencv-python>=4.10,<4.11",
    "mediapipe==0.10.14",
    "numpy>=1.26,<2",
    "scipy>=1.14,<1.15",
    "pydantic>=2,<3",
]

[project.scripts]
no-layups = "no_layups.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/no_layups"]
